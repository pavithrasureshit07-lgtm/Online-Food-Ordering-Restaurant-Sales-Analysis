spring.application.name=restaurant-management
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.sql.init.mode=never
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.mvc.hiddenmethod.filter.enabled=true
server.error.include-message=always
