<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Payments</title><link rel="stylesheet" href="/css/app.css"></head><body><aside class="sidebar"><div class="brand">🍽️ <span>Resto<span class="accent">Flow</span></span></div><nav><a href="/">▦　Dashboard</a><a href="/menu">☷　Menu Management</a><a href="/customers">♙　Customers</a><a href="/orders">🛒　Orders</a><a class="active" href="/payments">₹　Payments</a><a href="/reports">▤　Sales Reports</a></nav><div class="sidefoot">Scenario 12 · Restaurant Suite</div></aside><main class="main"><header><div><p class="eyebrow">TRANSACTIONS</p><h1>Payment Management</h1><p class="muted">Record cash, UPI and card payments</p></div></header><p class="notice success" th:if="${success}" th:text="${success}"></p><section class="panel"><h2>Record payment</h2><form method="post" action="/payments" class="formgrid"><label>Order<select name="orderId" required><option value="">Select order</option><option th:each="o:${orders}" th:value="${o.order_id}" th:text="${'#'+o.order_id+' — ₹'+o.total_amount}"></option></select></label><label>Amount (₹)<input type="number" name="amount" min="0" step="0.01" required></label><label>Method<select name="method"><option>Cash</option><option>UPI</option><option>Card</option><option>Other</option></select></label><button class="button">Save payment</button></form></section><section class="panel"><h2>Payment records</h2><div class="tablewrap"><table><thead><tr><th>Payment</th><th>Order</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${p.payment_id}"></td><td th:text="${'#'+p.order_id}"></td><td th:text="${'₹'+p.amount}"></td><td th:text="${p.payment_method}"></td><td th:text="${p.payment_status}"></td><td th:text="${p.payment_date}"></td></tr></tbody></table></div></section></main></body></html>
