<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu Management</title><link rel="stylesheet" href="/css/app.css"></head><body><aside class="sidebar"><div class="brand">🍽️ <span>Resto<span class="accent">Flow</span></span></div><nav><a href="/">▦　Dashboard</a><a class="active" href="/menu">☷　Menu Management</a><a href="/customers">♙　Customers</a><a href="/orders">🛒　Orders</a><a href="/payments">₹　Payments</a><a href="/reports">▤　Sales Reports</a></nav><div class="sidefoot">Scenario 12 · Restaurant Suite</div></aside><main class="main"><header><div><p class="eyebrow">CATALOGUE</p><h1>Menu Management</h1><p class="muted">Maintain food items, prices and availability</p></div></header><p class="notice success" th:if="${success}" th:text="${success}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p><section class="panel"><h2>Add menu item</h2><form method="post" action="/menu" class="formgrid"><label>Item name<input name="itemName" required maxlength="100" placeholder="e.g. Masala Dosa"></label><label>Category<input name="category" required maxlength="60" placeholder="Breakfast"></label><label>Price (₹)<input name="price" type="number" min="0" step="0.01" required></label><button class="button">Add item</button></form></section><section class="panel"><div class="panelhead"><h2>Menu catalogue</h2><input class="search" id="tableSearch" placeholder="Search menu..."></div><div class="tablewrap"><table id="dataTable"><thead><tr><th>ID</th><th>Item</th><th>Category</th><th>Price</th><th>Availability</th><th>Actions</th></tr></thead><tbody><tr th:each="i:${items}"><td th:text="${i.item_id}"></td><td th:text="${i.item_name}"></td><td th:text="${i.category}"></td><td th:text="${'₹'+i.price}"></td><td><span class="pill" th:text="${i.available?'Available':'Unavailable'}"></span></td><td class="actions"><details><summary class="smallbtn">Edit</summary><form method="post" th:action="@{'/menu/'+${i.item_id}+'/edit'}" class="editform"><input name="itemName" th:value="${i.item_name}" required><input name="category" th:value="${i.category}" required><input name="price" type="number" min="0" step="0.01" th:value="${i.price}" required><button class="smallbtn">Save</button></form></details><form method="post" th:action="@{'/menu/'+${i.item_id}+'/availability'}"><input type="hidden" name="available" th:value="${!i.available}"><button class="smallbtn" th:text="${i.available?'Disable':'Enable'}"></button></form><form method="post" th:action="@{'/menu/'+${i.item_id}+'/delete'}" onsubmit="return confirm('Delete this menu item?')"><button class="smallbtn dangerbtn">Delete</button></form></td></tr></tbody></table></div></section></main><script src="/js/app.js"></script></body></html>
