<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customers</title><link rel="stylesheet" href="/css/app.css"></head><body><aside class="sidebar"><div class="brand">🍽️ <span>Resto<span class="accent">Flow</span></span></div><nav><a href="/">▦　Dashboard</a><a href="/menu">☷　Menu Management</a><a class="active" href="/customers">♙　Customers</a><a href="/orders">🛒　Orders</a><a href="/payments">₹　Payments</a><a href="/reports">▤　Sales Reports</a></nav><div class="sidefoot">Scenario 12 · Restaurant Suite</div></aside><main class="main"><header><div><p class="eyebrow">PEOPLE</p><h1>Customer Management</h1><p class="muted">Register and manage customer contact details</p></div></header><p class="notice success" th:if="${success}" th:text="${success}"></p><section class="panel"><h2>Register customer</h2><form method="post" action="/customers" class="formgrid"><label>Customer name<input name="customerName" required maxlength="100"></label><label>Phone<input name="phone" required maxlength="20"></label><label>Email<input name="email" type="email" maxlength="120"></label><button class="button">Add customer</button></form></section><section class="panel"><div class="panelhead"><h2>Customers</h2><input class="search" id="tableSearch" placeholder="Search customers..."></div><div class="tablewrap"><table id="dataTable"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead><tbody><tr th:each="c:${customers}"><td th:text="${c.customer_id}"></td><td th:text="${c.customer_name}"></td><td th:text="${c.phone}"></td><td th:text="${c.email}"></td><td><details><summary class="smallbtn">Edit</summary><form method="post" th:action="@{'/customers/'+${c.customer_id}+'/edit'}" class="editform"><input name="customerName" th:value="${c.customer_name}" required><input name="phone" th:value="${c.phone}" required><input name="email" type="email" th:value="${c.email}"><button class="smallbtn">Save</button></form></details></td></tr></tbody></table></div></section></main><script src="/js/app.js"></script></body></html>
