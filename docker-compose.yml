services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: restaurant_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "3306:3306"
    volumes:
      - restaurant_mysql_data:/var/lib/mysql
      - ./DBMS-Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./DBMS-Database/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/restaurant_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      PORT: 8080
    ports:
      - "8080:8080"
volumes:
  restaurant_mysql_data:
